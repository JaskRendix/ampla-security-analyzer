[project]
name = "ampla-security"
version = "1.0.0"
description = "Ampla Security Analysis Engine"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Giorgio" }
]

license = { file = "LICENSE" }

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "lxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = [
    "ampla_security/testing"
]
addopts = "--cov=ampla_security --cov-report=term-missing"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
